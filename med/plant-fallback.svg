    <path d="M0 100 Q-30 0 -90 -60" stroke="#b7e4c7" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M0 100 Q10 10 0 -110" stroke="#b7e4c7" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M0 100 Q40 10 95 -50" stroke="#b7e4c7" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Leaves -->
    <path d="M-90 -60 C-150 -80 -170 -10 -90 10 C-30 -10 -50 -50 -90 -60 Z" fill="url(#leafGrad)" />
    <path d="M0 -110 C-50 -180 0 -220 30 -190 C60 -150 40 -120 0 -110 Z" fill="url(#leafGrad)" />
    <path d="M95 -50 C160 -70 170 0 105 15 C50 -5 65 -40 95 -50 Z" fill="url(#leafGrad)" />
  </g>
  <text x="400" y="540" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#d8f3dc" text-anchor="middle" letter-spacing="2">
    FLORAPEDIA BOTANICAL COLLECTION
  </text>
</svg>
